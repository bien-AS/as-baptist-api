name: API CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      AUTH_MODE: mock
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+asyncpg://app_api:change-me@127.0.0.1:5432/baptist
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://app_migrator:change-me@127.0.0.1:5432/baptist
      TEST_API_DATABASE_URL: postgresql+asyncpg://app_api:change-me@127.0.0.1:5432/baptist
      TEST_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://app_migrator:change-me@127.0.0.1:5432/baptist
      TEST_WORKER_DATABASE_URL: postgresql+asyncpg://app_worker:change-me@127.0.0.1:5432/baptist
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: baptist
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baptist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check app migrations tests scripts

      - name: Strict typecheck
        run: python -m mypy app

      - name: Architecture and secret gates
        run: python scripts/check_architecture.py

      - name: Bootstrap restricted database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname baptist <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_migrator') THEN
              CREATE ROLE app_migrator LOGIN PASSWORD 'change-me' SUPERUSER CREATEDB CREATEROLE NOINHERIT;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_api') THEN
              CREATE ROLE app_api LOGIN PASSWORD 'change-me' NOSUPERUSER NOBYPASSRLS NOINHERIT;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_worker') THEN
              CREATE ROLE app_worker LOGIN PASSWORD 'change-me' NOSUPERUSER NOBYPASSRLS NOINHERIT;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_readonly') THEN
              CREATE ROLE app_readonly LOGIN PASSWORD 'change-me' NOSUPERUSER NOBYPASSRLS NOINHERIT;
            END IF;
          END
          $$;
          ALTER ROLE app_migrator PASSWORD 'change-me' SUPERUSER CREATEDB CREATEROLE NOINHERIT;
          ALTER ROLE app_api PASSWORD 'change-me' NOSUPERUSER NOBYPASSRLS NOINHERIT;
          ALTER ROLE app_worker PASSWORD 'change-me' NOSUPERUSER NOBYPASSRLS NOINHERIT;
          ALTER ROLE app_readonly PASSWORD 'change-me' NOSUPERUSER NOBYPASSRLS NOINHERIT;
          SQL

      - name: Verify migration upgrade and downgrade
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Apply deterministic local seed
        env:
          PGPASSWORD: change-me
        run: psql --host 127.0.0.1 --port 5432 --username app_migrator --dbname baptist --file sql/seed/local.sql

      - name: Test with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Build production container
        run: docker build --tag baptist-api:ci .
