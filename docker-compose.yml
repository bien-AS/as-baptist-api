services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: baptist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baptist"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      AUTH_MODE: mock
      DATABASE_URL: postgresql+asyncpg://app_api:local-api-password@db:5432/baptist
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://app_migrator:local-migrator-password@db:5432/baptist
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
